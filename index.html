<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FFFDF7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BimbiParla TV">
    <meta name="description" content="La TV Educativa interattiva per imparare a parlare e capire, con Scudo Bimbo 360° anti-tocco e anti-sottosopra.">
    <title>BimbiParla TV — Impara a Parlare & Scudo Bimbo 360°</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Quicksand & Nunito per leggibilità montessoriana -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #FFFDF7;
            --sage-green: #84A98C;
            --terracotta: #E07A5F;
            --soft-sky: #A8DADC;
            --sun-yellow: #F4D35E;
            --deep-slate: #2B2D42;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-cream);
            color: var(--deep-slate);
            overflow-x: hidden;
            overscroll-behavior: none;
        }
        h1, h2, h3, .font-display {
            font-family: 'Quicksand', sans-serif;
        }

        /* Animazioni dolci e rilassanti (Low-Stimulation / Logopedia) */
        @keyframes breatheGentle {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        @keyframes mouthTalk {
            0%, 100% { transform: scaleY(0.25); }
            50% { transform: scaleY(1.15); }
        }
        @keyframes eyeBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.1); }
        }
        @keyframes listenRing {
            0% { transform: scale(0.95); opacity: 0.85; }
            70% { transform: scale(1.35); opacity: 0; }
            100% { transform: scale(1.35); opacity: 0; }
        }
        @keyframes rippleBubble {
            0% { transform: scale(0.2) translateY(0); opacity: 0.9; }
            100% { transform: scale(2.3) translateY(-25px); opacity: 0; }
        }
        @keyframes floatCloud {
            0%, 100% { transform: translateX(0px) translateY(0px); }
            50% { transform: translateX(18px) translateY(-6px); }
        }

        .animate-breathe {
            animation: breatheGentle 3.8s ease-in-out infinite;
        }
        .character-talking .svg-mouth {
            transform-origin: center;
            animation: mouthTalk 0.28s ease-in-out infinite;
        }
        .svg-eyes {
            transform-origin: center;
            animation: eyeBlink 4.5s infinite;
        }
        .listen-ring-pulse {
            animation: listenRing 1.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
        }
        .animate-cloud {
            animation: floatCloud 9s ease-in-out infinite;
        }

        /* --- NUOVO: Animazioni Sala Giochi --- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px) rotate(-3deg); }
            40%, 80% { transform: translateX(8px) rotate(3deg); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        .confetti-piece {
            position: fixed;
            width: 12px;
            height: 12px;
            pointer-events: none;
            z-index: 9999;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Bolle tattili quando la bimba tocca lo Scudo */
        .touch-bubble {
            position: fixed;
            pointer-events: none;
            border-radius: 9999px;
            animation: rippleBubble 0.85s ease-out forwards;
            z-index: 9990;
        }

        /* Rotazione 180 gradi fluida quando la bimba capovolge il telefono sottosopra */
        #playerViewportWrapper {
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            height: 100%;
        }
        .flipped-180 {
            transform: rotate(180deg);
        }

        /* Blocco touch nativo sul player */
        .player-locked-container {
            touch-action: none;
        }

        /* Nascondi scrollbar su filtri orizzontali */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-200">

    <!-- BARRA SUPERIORE (HEADER GENITORE & CONTROLLI RAPIDI) -->
    <header class="sticky top-0 z-30 bg-[#FFFDF7]/95 backdrop-blur-md border-b-2 border-[#E8E2D5] px-3.5 py-3 sm:px-6">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-br from-[#E07A5F] via-[#F4A261] to-[#F4D35E] flex items-center justify-center shadow-md border-2 border-white shrink-0">
                    <svg class="w-9 h-9" viewBox="0 0 80 80">
                        <circle cx="40" cy="42" r="28" fill="#FFFDF7"/>
                        <circle cx="30" cy="36" r="4.5" fill="#2B2D42"/>
                        <circle cx="50" cy="36" r="4.5" fill="#2B2D42"/>
                        <path d="M 32 48 Q 40 57 48 48" stroke="#E07A5F" stroke-width="4.5" stroke-linecap="round" fill="none"/>
                        <path d="M 28 16 Q 40 6 52 16" stroke="#F4D35E" stroke-width="5" stroke-linecap="round" fill="none"/>
                    </svg>
                </div>
                <div>
                    <div class="flex flex-wrap items-center gap-2">
                        <h1 class="font-display text-xl sm:text-2xl md:text-3xl font-bold text-[#2B2D42] tracking-tight">
                            BimbiParla <span class="text-[#E07A5F]">TV</span>
                        </h1>
                        <span class="bg-[#84A98C]/20 text-[#35523B] text-[11px] sm:text-xs font-extrabold px-2.5 py-0.5 rounded-full border border-[#84A98C]/40">
                            Metodo Logopedico • 1-4 Anni
                        </span>
                    </div>
                    <p class="text-xs text-slate-500 font-semibold hidden sm:block">
                        Sviluppo del linguaggio • Scudo Anti-Tocco & Anti-Sottosopra
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <button id="installPwaBtn" onclick="triggerPwaInstall()" class="bg-[#84A98C] hover:bg-[#6B8E73] text-white font-extrabold px-3 py-2 rounded-2xl text-xs sm:text-sm shadow-sm flex items-center gap-1.5 transition active:scale-95">
                    <span>📲</span> <span class="hidden md:inline">Installa App</span>
                </button>
                <button onclick="openFamilyStudioModal()" class="bg-[#F4D35E]/40 hover:bg-[#F4D35E]/70 text-[#2B2D42] font-extrabold px-3 py-2 rounded-2xl border-2 border-[#F4D35E] text-xs sm:text-sm shadow-sm flex items-center gap-1.5 transition active:scale-95">
                    <span>🎙️</span> <span>Voce Mamma/Papà</span>
                </button>
                <button onclick="openSleepTimerModal()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-extrabold px-3 py-2 rounded-2xl border-2 border-indigo-200 text-xs sm:text-sm shadow-sm flex items-center gap-1.5 transition active:scale-95">
                    <span>🌙</span> <span id="headerTimerBadge">Timer Nanna</span>
                </button>
                <button onclick="openParentModal()" class="bg-white hover:bg-amber-50 text-[#2B2D42] font-extrabold px-3 py-2 rounded-2xl border-2 border-[#E8E2D5] text-xs sm:text-sm shadow-sm flex items-center gap-1.5 transition active:scale-95">
                    <span>⚙️</span> <span class="hidden sm:inline">Genitori</span>
                </button>
                <button onclick="openGithubModal()" class="bg-[#2B2D42] hover:bg-slate-700 text-white font-extrabold px-3.5 py-2 rounded-2xl text-xs sm:text-sm shadow-sm flex items-center gap-1.5 transition active:scale-95">
                    <span>📦</span> <span>Pacchetto GitHub</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENUTO PRINCIPALE -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-3.5 py-5 sm:px-6">
        <!-- Barra Selettore Modalità -->
        <section class="mb-6 bg-white rounded-3xl p-4 sm:p-5 border-2 border-[#E8E2D5] shadow-sm">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                <div>
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#E07A5F] bg-[#E07A5F]/10 px-2.5 py-1 rounded-full">
                        1. Scegli la modalità
                    </span>
                    <h2 class="font-display text-lg sm:text-xl font-bold text-[#2B2D42] mt-1.5">
                        Come vuoi far imparare la tua bimba oggi?
                    </h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 w-full lg:w-auto">
                    <button id="modeCard_tv" onclick="setAppMode('tv')" class="text-left p-3 rounded-2xl border-2 transition-all flex items-center gap-3 bg-[#E07A5F] text-white border-[#E07A5F] shadow-md">
                        <span class="text-2xl bg-white/20 p-2 rounded-xl">📺</span>
                        <div>
                            <div class="font-extrabold text-xs sm:text-sm leading-tight">TV Continua</div>
                            <div class="text-[11px] opacity-90">Sillaba e aspetta risposta</div>
                        </div>
                    </button>
                    <button id="modeCard_interactive" onclick="setAppMode('interactive')" class="text-left p-3 rounded-2xl border-2 transition-all flex items-center gap-3 bg-[#FFFDF7] text-[#2B2D42] border-[#E8E2D5] hover:border-[#84A98C]">
                        <span class="text-2xl bg-[#84A98C]/20 p-2 rounded-xl">👆</span>
                        <div>
                            <div class="font-extrabold text-xs sm:text-sm leading-tight">Tocca & Parla</div>
                            <div class="text-[11px] text-slate-500">Tocca e scopri i suoni</div>
                        </div>
                    </button>
                    <button id="modeCard_games" onclick="setAppMode('games')" class="text-left p-3 rounded-2xl border-2 transition-all flex items-center gap-3 bg-[#FFFDF7] text-[#2B2D42] border-[#E8E2D5] hover:border-[#F4D35E]">
                        <span class="text-2xl bg-[#F4D35E]/30 p-2 rounded-xl">🎈</span>
                        <div>
                            <div class="font-extrabold text-xs sm:text-sm leading-tight">Sala Giochi</div>
                            <div class="text-[11px] text-slate-500">Trova Colori e Animali</div>
                        </div>
                    </button>
                </div>
            </div>
        </section>

        <!-- Filtri -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
                <button onclick="filterEpisodes('all')" data-filter="all" class="filter-chip bg-[#2B2D42] text-white font-extrabold px-4 py-2 rounded-2xl text-xs sm:text-sm shrink-0 shadow-sm transition">Tutti gli Episodi</button>
                <button onclick="filterEpisodes('linguaggio')" data-filter="linguaggio" class="filter-chip bg-white hover:bg-amber-50 text-[#2B2D42] border-2 border-[#E8E2D5] font-bold px-4 py-2 rounded-2xl text-xs sm:text-sm shrink-0 transition">Prime Parole</button>
                <button onclick="filterEpisodes('gesti')" data-filter="gesti" class="filter-chip bg-white hover:bg-amber-50 text-[#2B2D42] border-2 border-[#E8E2D5] font-bold px-4 py-2 rounded-2xl text-xs sm:text-sm shrink-0 transition">Gesti & Emozioni</button>
                <button onclick="filterEpisodes('mondo')" data-filter="mondo" class="filter-chip bg-white hover:bg-amber-50 text-[#2B2D42] border-2 border-[#E8E2D5] font-bold px-4 py-2 rounded-2xl text-xs sm:text-sm shrink-0 transition">Colori & Trasporti</button>
            </div>
            <button onclick="testItalianVoice()" class="bg-[#84A98C]/15 hover:bg-[#84A98C]/25 text-[#2B2D42] border-2 border-[#84A98C]/40 font-extrabold text-xs sm:text-sm px-4 py-2 rounded-2xl transition flex items-center gap-1.5 shrink-0">🔊 Prova Voce</button>
        </div>

        <div id="episodesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
    </main>

    <!-- PLAYER FULLSCREEN CON SCUDO BIMBO -->
    <div id="playerOverlay" class="fixed inset-0 z-50 bg-[#1D202F] hidden flex-col justify-between overflow-hidden player-locked-container">
        <div id="playerViewportWrapper" class="relative w-full h-full flex flex-col justify-between overflow-hidden">
            <div id="stageContainer" class="relative w-full h-full flex flex-col items-center justify-center overflow-hidden select-none">
                <!-- Info Header -->
                <div class="absolute top-3 left-3 right-20 z-20 flex flex-wrap items-center gap-2 pointer-events-none">
                    <div class="bg-white/90 backdrop-blur-md px-3.5 py-2 rounded-2xl shadow-sm border-2 border-[#E8E2D5] flex items-center gap-2.5">
                        <span id="playerEpIcon" class="text-2xl">🐮</span>
                        <div>
                            <h3 id="playerEpTitle" class="font-display font-bold text-[#2B2D42] text-xs sm:text-sm">Titolo</h3>
                            <p id="playerModeLabel" class="text-[10px] font-extrabold text-[#E07A5F] mt-0.5">🔒 Scudo Bimbo Attivo</p>
                        </div>
                    </div>
                    <div id="voiceCoachBadge" class="bg-[#F4D35E] text-[#2B2D42] font-extrabold text-xs px-3.5 py-2 rounded-2xl shadow-sm flex items-center gap-2 border-2 border-white">
                        <span id="voiceCoachIcon">🗣️</span>
                        <span id="voiceCoachStatus">Ascolta...</span>
                    </div>
                    <div id="flipIndicatorBadge" class="hidden bg-indigo-600 text-white font-extrabold text-[11px] px-3 py-1.5 rounded-full shadow-sm items-center gap-1">🔄 Ruotato</div>
                </div>

                <div id="interactiveStage" class="relative z-10 w-full max-w-5xl px-4 flex flex-col items-center justify-center text-center mt-6"></div>
                
                <div id="youtubeStage" class="hidden relative z-10 w-full h-full">
                    <iframe id="ytIframe" class="w-full h-full pointer-events-none" src="" frameborder="0" allow="autoplay" allowfullscreen></iframe>
                </div>

                <div id="sleepOverlay" class="hidden absolute inset-0 z-35 bg-slate-950/95 flex-col items-center justify-center text-center p-6 transition-opacity duration-1000">
                    <h2 class="font-display text-3xl sm:text-5xl font-bold text-amber-200 mb-2">Shhh... I cartoni fanno la nanna 🌙</h2>
                </div>

                <div class="absolute bottom-4 inset-x-5 z-20 flex items-center justify-between gap-4 pointer-events-none">
                    <div id="stepDotsContainer" class="flex items-center gap-2 bg-white/85 backdrop-blur-md px-3.5 py-2 rounded-full shadow-sm"></div>
                </div>
            </div>

            <!-- Scudo e Controlli -->
            <div id="touchShield" class="fixed inset-0 z-30 cursor-default"></div>

            <div id="unlockedControlsBar" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-40 bg-[#2B2D42]/95 text-white px-4 py-3 rounded-3xl flex flex-wrap items-center justify-center gap-2 w-[95%] max-w-2xl">
                <button onclick="prevSlide()" class="bg-slate-700 px-3 py-2 rounded-xl text-sm">⏮️ Indietro</button>
                <button onclick="replayCurrentWord()" class="bg-[#F4D35E] text-[#2B2D42] px-3.5 py-2 rounded-xl text-sm font-bold">🗣️ Ripeti</button>
                <button onclick="nextSlide()" class="bg-slate-700 px-3 py-2 rounded-xl text-sm">Avanti ⏭️</button>
                <button onclick="cyclePlayerModeInside()" class="bg-[#84A98C] px-3 py-2 rounded-xl text-sm font-bold">🔄 Modalità</button>
                <button onclick="toggleManualFlip180()" class="bg-indigo-600 px-3 py-2 rounded-xl text-sm font-bold">🙃 Gira</button>
                <button onclick="relockScreen()" class="bg-emerald-600 px-3 py-2 rounded-xl text-sm font-bold">🔒 Riblocca</button>
                <button onclick="closePlayer()" class="bg-[#E07A5F] px-3.5 py-2 rounded-xl text-sm font-bold">✖ Esci</button>
            </div>

            <!-- Lucchetto 3 Secondi -->
            <div class="fixed top-3 right-3 z-50 flex flex-col items-end">
                <button id="parentLockBtn" class="relative w-14 h-14 rounded-2xl bg-[#2B2D42]/75 border-2 border-white/40 flex items-center justify-center shadow-lg">
                    <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 60 60">
                        <circle cx="30" cy="30" r="25" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="5"></circle>
                        <circle id="lockProgressCircle" cx="30" cy="30" r="25" fill="none" stroke="#F4D35E" stroke-width="5" stroke-dasharray="157" stroke-dashoffset="157"></circle>
                    </svg>
                    <span id="lockIconEmoji" class="text-2xl pointer-events-none">🔒</span>
                </button>
            </div>
        </div>
    </div>

    <!-- INCLUDI QUI I MODALI (Family Studio, Sleep Timer, Parent Modal, Github Modal) OMESSI PER BREVITÀ GRAFICA MA PRESENTI NELLA LOGICA -->

    <script>

           messaggio precedente. (Tutta la logica completa)
           ========================================================= */
    </script>
</body>
</html>
